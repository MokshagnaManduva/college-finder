[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "college-finder-api"
version = "0.1.0"
description = "CampusFind API rebuilt with FastAPI and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.10,<3",
  "bcrypt>=4.2,<6",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.setuptools.package-data]
seed = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

