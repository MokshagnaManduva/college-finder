services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
      POSTGRES_DB: college_finder
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college -d college_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

