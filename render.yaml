# Free temporary demo. The PostgreSQL database expires after 30 days.
# Deploy only this project directory as the repository root.
services:
  - type: web
    name: college-finder-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health/ready
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-finder-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: JWT_EXPIRY_DAYS
        value: "7"
      - key: ALLOW_DEMO_SEED
        value: "false"
      - key: BOOTSTRAP_DEMO_CATALOG
        value: "true"
databases:
  - name: college-finder-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: college_finder_demo
    user: college_finder_demo
    ipAllowList: []
